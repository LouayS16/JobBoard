# ===================================================================
# Partie 2 - Methode 2 : Configuration Statique de l'API Gateway
# (Sans Eureka : les requetes pointent directement sur les adresses physiques)
# ===================================================================
spring.application.name=gateway-static
server.port=8080

# Desactivation Eureka pour le mode statique
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Route statique vers candidat (port 8081)
spring.cloud.gateway.routes[0].id=CANDIDAT
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidat/**,/candidats/**,/mic1/**

# Route statique vers job (port 8082)
spring.cloud.gateway.routes[1].id=JOB
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**,/api/**

# Logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
