# ===================================================================
# Configuration de l'API Gateway - Prosit 3
# Applications Web Distribuees - ESPRIT
# ===================================================================
spring.application.name=gateway
server.port=8085

# -------------------------------------------------------------------
# Enregistrement & Decouverte Eureka (Partie 1 & Partie 3)
# -------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

# -------------------------------------------------------------------
# Partie 3 - Methode 2 : Configuration dynamique des routes via Eureka (lb://)
# -------------------------------------------------------------------
# Route vers le microservice 'candidat' (supporte /candidat/**, /candidats/** et le path interne /mic1/**)
spring.cloud.gateway.routes[0].id=CANDIDAT
spring.cloud.gateway.routes[0].uri=lb://candidat
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidat/**,/candidats/**,/mic1/**

# Route vers le microservice 'job' (supporte /jobs/** et le path interne /api/**)
spring.cloud.gateway.routes[1].id=JOB
spring.cloud.gateway.routes[1].uri=lb://job
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**,/api/**

# -------------------------------------------------------------------
# Partie 3 - 2.a : Activation des logs de routage pour le Load Balancer
# -------------------------------------------------------------------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# -------------------------------------------------------------------
# Actuator Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Gateway
info.app.version=1.0.0
info.app.description=API Gateway Spring Cloud avec Eureka et Load Balancing
